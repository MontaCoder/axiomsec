name: CI

on:
  push:
    branches: [develop, main, "release-*", "release/*", "hotfix-*", "hotfix/*"]
  pull_request:
    branches: [develop, main, "release/*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      # The integration and end-to-end layers drive the real binary, so it has
      # to exist before the suite runs. Building here also means a broken
      # build fails the gate instead of silently skipping those layers.
      - name: Build for the integration layers
        run: bun run build --single --skip-install
        working-directory: packages/axiomsec
      - run: bun test --timeout 60000

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: bun run build --single --skip-install
        working-directory: packages/axiomsec
